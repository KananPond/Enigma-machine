[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-m3"
version = "2.0.0"
description = "A faithful Enigma M3 machine with a native desktop interface and automatic breaking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["enigma", "cipher", "cryptography", "simulation", "bletchley", "bombe", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Education",
    "Environment :: Win32 (MS Windows)",
]
# numpy is only needed by the breaking routines (the menu attack and the
# rotor sweep).  The machine, the decoding and the language model run on the
# standard library alone.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
enigma = "enigma_gui:main"

[tool.setuptools]
packages = ["enigma", "enigma_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
